name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NO_COLOR: "1"

# Two jobs, so the token that can write never shares a job with code this workflow fetches: the
# repository's, the compiler's, Homebrew's and OLS's all run in build, which can only read.
jobs:
  build:
    # Test on macOS ARM64, and Linux amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos-arm64
          - runner: ubuntu-latest
            platform: linux-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Refuse any ref but the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::a release is built from the default branch, and this run is on $GITHUB_REF"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make sure clang is on PATH
        if: runner.os == 'Linux'
        run: |
          if ! command -v clang; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      # Installs mise and the compiler mise.toml pins, which brings its own LLVM. No cache, so a
      # release never builds with a compiler that an earlier run saved.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.6
          cache: false

      - name: Check the compiler is the one odx.json pins
        run: |
          mise exec -- odin version
          want=$(python3 -c 'import json; print(json.load(open("odx.json"))["odin"])')
          got=$(mise exec -- odin version | awk '{ print $NF }')
          if [ "$got" != "$want" ]; then
            echo "::error::mise installed odin '$got', and odx.json pins '$want'"
            exit 1
          fi

      # tests/e2e runs every command under timeout, which the image's software list doesn't name.
      - name: Make sure timeout is on PATH
        if: runner.os == 'macOS'
        run: |
          if ! command -v timeout; then
            brew install coreutils
            mkdir -p "$RUNNER_TEMP/bin"
            ln -s "$(brew --prefix)/bin/gtimeout" "$RUNNER_TEMP/bin/timeout"
            echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          fi

      - name: mise run fmt, which must change nothing
        run: |
          mise run fmt
          git diff --exit-code

      - run: mise run build
      - run: mise run test
      - run: mise run golden
      - run: mise run selection
      - run: mise run self
      - run: mise run e2e
      - run: mise run dist

      - name: Check the tarball against its .sha256
        run: |
          cd build/dist || exit 1
          shasum -a 256 -c ./*.sha256

      # build/dist holds the tarball and its .sha256, which become the artifact's two files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: build/dist/*
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: build
    # No checkout and nothing installed: every command here is one the runner image ships.
    runs-on: macos-26
    timeout-minutes: 10
    # The token reaches only the two steps that name it, the ones that call gh.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # The release, and so the tag, is what the tarball's own VERSIONS file states.
      - name: Check the tarballs and read their release
        id: name
        run: |
          cd dist || exit 1
          set -- *.tar.gz
          if [ ! -f "$1" ]; then
            echo "::error::the artifact must hold at least one .tar.gz, and it holds: $(ls)"
            exit 1
          fi
          release=
          notes=$RUNNER_TEMP/notes
          assets=$RUNNER_TEMP/assets
          : >"$notes"
          : >"$assets"
          for asset in "$@"; do
            if [ ! -f "$asset.sha256" ]; then
              echo "::error::$asset has no .sha256 beside it"
              exit 1
            fi
            shasum -a 256 -c "$asset.sha256"
            tar -xzOf "$asset" VERSIONS >"$RUNNER_TEMP/VERSIONS"
            this=$(sed -n 's/^odx release: //p' "$RUNNER_TEMP/VERSIONS")
            platform=$(sed -n 's/^platform: //p' "$RUNNER_TEMP/VERSIONS")
            if [[ ! $this =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::VERSIONS in $asset has no 'odx release: <x.y.z>' line; it gives '$this'"
              exit 1
            fi
            if [ "$asset" != "odx-$this-$platform.tar.gz" ]; then
              echo "::error::$asset holds release $this for $platform, which its name doesn't say"
              exit 1
            fi
            if [ -n "$release" ] && [ "$release" != "$this" ]; then
              echo "::error::$asset holds release $this, and an earlier asset holds $release"
              exit 1
            fi
            if [ -z "$release" ]; then
              {
                echo '```text'
                grep -v -e '^platform: ' -e '^minimum macOS: ' "$RUNNER_TEMP/VERSIONS"
                echo '```'
              } >"$notes"
            fi
            release=$this
            printf '%s\n%s\n' "$asset" "$asset.sha256" >>"$assets"
          done
          echo "tag=v$release" >>"$GITHUB_OUTPUT"

      # Listing drafts needs the token that can write, so this check comes after the build.
      - name: Refuse a release or a tag that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if grep -Fxq "$TAG" <<<"$releases"; then
            echo "::error::a release $TAG exists already, as a draft or published; raise RELEASE in odx/rules.odin or delete it"
            exit 1
          fi
          if grep -Fxq "refs/tags/$TAG" <<<"$refs"; then
            echo "::error::a tag $TAG exists already; raise RELEASE in odx/rules.odin or delete the tag"
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          cd dist || exit 1
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done <"$RUNNER_TEMP/assets"
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_SHA" >"$RUNNER_TEMP/CHANGELOG.md"
          awk -v h="## ${TAG#v}" '$0 == h { on = 1; next } /^## / { on = 0 } on' \
            "$RUNNER_TEMP/CHANGELOG.md" >"$RUNNER_TEMP/changes"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changes"; then
            echo "::error::CHANGELOG.md has no '## ${TAG#v}' section with text under it"
            exit 1
          fi
          cat "$RUNNER_TEMP/changes" "$RUNNER_TEMP/notes" >"$RUNNER_TEMP/body"
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/body" "${files[@]}"
