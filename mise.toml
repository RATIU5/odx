[tools]
odin = "dev-2026-09"

[env]
OUT = "build"
ODIN_VET = "-vet -vet-tabs -vet-cast -strict-style -warnings-as-errors"

[tasks.build]
description = "Build the odx binary (debug)"
alias = "b"
sources = ["odx/**/*.odin"]
outputs = ["{{ env.OUT }}/odx"]
run = "mkdir -p $OUT && odin build odx -out:$OUT/odx $ODIN_VET -debug"

[tasks.run]
description = "Build and run odx"
depends = ["build"]
run = "$OUT/odx"

[tasks.test]
description = "Run the tests"
alias = "t"
run = "mkdir -p $OUT && odin test odx $ODIN_VET -out:$OUT/odx_test"

[tasks.fmt]
description = "Format the Odin sources"
alias = "f"
run = "odinfmt -w odx"
