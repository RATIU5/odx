[tools]
odin = "dev-2026-09" # the only version odx is tested against; odx doctor reports drift

[env]
# macOS: the prebuilt odin's -sanitize:address links only against LLVM's clang, not Apple's
_.path = ["{% if os() == 'macos' %}/opt/homebrew/opt/llvm@22/bin{% endif %}"]
OUT = "build"
ODX = "{{ config_root }}/build/odx"
# vet flags used for odx's own sources; the same list odx recommends to projects
ODIN_VET = "-vet -vet-tabs -vet-cast -strict-style -warnings-as-errors"

[tasks.build]
description = "Build the odx binary (debug)"
alias = "b"
sources = ["odx/**/*.odin", "rules/**/*"] # rules/ is embedded, so it is a build input
outputs = ["{{ env.OUT }}/odx"]
run = "mkdir -p $OUT && odin build odx -out:$OUT/odx $ODIN_VET -vet-packages:odx -debug"

[tasks.release]
description = "Optimized binary for distribution"
sources = ["odx/**/*.odin", "rules/**/*"]
outputs = ["{{ env.OUT }}/release/odx"]
run = "mkdir -p $OUT/release && odin build odx -out:$OUT/release/odx $ODIN_VET -vet-packages:odx -o:speed"

[tasks.install]
description = "Put a release build on PATH for local use in other projects"
depends = ["release"]
run = "install -m 755 $OUT/release/odx ~/.local/bin/odx"

[tasks.fmt]
description = "Format all odin files in this project"
alias = "f"
run = "odinfmt -w odx"  # tests/fixtures excluded on purpose

[tasks.odx]
description = "Run the odx binary (debug)"
depends = ["build"]
run = "${ODX}"

[tasks.test]
description = "odx's own unit tests"
run = "mkdir -p $OUT && odin test odx $ODIN_VET -sanitize:address -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:$OUT/odx_test"

[tasks.exemplars]
description = "Every rules/<topic>/example/<pkg> compiles and passes its own topic checks"
depends = ["build"]
run = '''
set -e
for pkg in rules/*/example/*/; do
  odin check "$pkg" $ODIN_VET -no-entry-point && echo "ok $pkg"
done
for t in rules/*/; do $ODX check --exemplar "$(basename "$t")"; done
'''

[tasks.self]
description = "odx checks its own sources with its own rules"
depends = ["build"]
run = "$ODX doctor --ci && $ODX check"

[tasks.audit]
description = "Redundancy audit: every construct odx retired because the compiler owns it must still be rejected with no flags; rerun on each Odin release"
run = '''
for f in tests/compiler/*.odin; do
  if odin check "$f" -file -no-entry-point >/dev/null 2>&1; then
    echo "FAIL $f: the compiler now accepts this; odx needs a rule for it again"; exit 1
  fi
  echo "ok $f (compiler rejects it)"
done
'''

[tasks.ci]
description = "Everything CI runs, in order"
depends = ["build", "test", "fixtures", "exemplars", "audit", "self", "evidence", "architecture"]

[tasks.architecture]
description = "Exercise complete architecture evidence and incremental scan coverage"
depends = ["build"]
run = 'ODX_ODIN="$(command -v odin)" odin run docs/milestones/2-probe -out:$OUT/odx_architecture -vet -strict-style'

[tasks.evidence]
description = "Exercise analysis coverage and unavailable compiler evidence through the CLI"
depends = ["build"]
run = 'ODX_ODIN="$(command -v odin)" odin run docs/milestones/1-probe -out:$OUT/odx_evidence -vet -strict-style'

[tasks.fixtures]
description = "Every tests/fixtures/<name>/ is checked and diffed against its // want: markers, plus every rule and topic.md block"
depends = ["build"]
run = "$ODX self-test"
