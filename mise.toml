[tools]
odin = "dev-2026-09" # the only version odx is tested against; odx doctor reports drift

[env]
# macOS: the prebuilt odin's -sanitize:address links only against LLVM's clang, not Apple's
_.path = ["{% if os() == 'macos' %}/opt/homebrew/opt/llvm@22/bin{% endif %}"]
OUT = "build"
ODX = "{{ config_root }}/build/odx"
# vet flags used for odx's own sources; the same list odx recommends to projects
ODIN_VET = "-vet -vet-tabs -vet-cast -strict-style -warnings-as-errors"

[tasks.build]
description = "Build the odx binary (debug)"
alias = "b"
sources = ["odx/**/*.odin", "rules/**/*", "templates/**/*"] # rules/ and templates/ are embedded, so they are build inputs
outputs = ["{{ env.OUT }}/odx"]
run = "odin build odx -out:$OUT/odx $ODIN_VET -vet-packages:odx -debug"

[tasks.release]
description = "Optimized binary for distribution (ubi: path once a tagged release exists, 18.3)"
sources = ["odx/**/*.odin", "rules/**/*", "templates/**/*"]
outputs = ["{{ env.OUT }}/release/odx"]
run = "odin build odx -out:$OUT/release/odx $ODIN_VET -vet-packages:odx -o:speed"

[tasks.install]
description = "Put a release build on PATH for local use in other projects"
depends = ["release"]
run = "install -m 755 $OUT/release/odx ~/.local/bin/odx"

[tasks.fmt]
description = "Format all odin files in this project"
alias = "f"
run = "for d in odx spikes; do odinfmt -w $d; done"  # odinfmt (from OLS) takes one path; tests/fixtures excluded on purpose

[tasks.odx]
description = "Run the odx binary (debug)"
depends = ["build"]
run = "${ODX}"

[tasks.test]
description = "odx's own unit tests"
run = "odin test odx $ODIN_VET -sanitize:address -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:$OUT/odx_test"

[tasks.spikes]
description = "M0 feasibility spikes (spikes/README.md records results)"
run = '''
set -e
for s in spikes/*/; do
  [ -f "$s/main.odin" ] || continue
  odin build "$s" -out:$OUT/spike_$(basename "$s") $ODIN_VET -debug
done
'''

[tasks.exemplars]
description = "Every rules/<topic>/example/<pkg> compiles and passes its own topic checks"
depends = ["build"]
run = '''
set -e
for pkg in rules/*/example/*/; do
  odin check "$pkg" $ODIN_VET -no-entry-point && echo "ok $pkg"
done
for t in rules/*/; do $ODX check --exemplar "$(basename "$t")"; done
'''

[tasks.self]
description = "odx checks its own sources with its own rules (milestone stop condition)"
depends = ["build"]
run = "$ODX doctor --ci && $ODX check"

[tasks.eval]
description = "odx ask recall@3 / MRR over rules/ask-eval.json5 (M6a); fails under 0.9"
depends = ["build"]
run = "$ODX ask --eval"

[tasks.ci]
description = "Everything CI runs, in order"
depends = ["build", "test", "fixtures", "exemplars", "eval", "self"]

[tasks.fixtures]
description = "Every tests/fixtures/<name>/ is checked and diffed against its // want: markers (17.14)"
depends = ["build"]
run = "$ODX self-test"
