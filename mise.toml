[tools]
odin = "dev-2026-09"

[env]
OUT = "build"
ODIN_VET = "-vet -vet-tabs -vet-cast -strict-style -warnings-as-errors"

[tasks.build]
description = "Build the odx binary (debug)"
alias = "b"
sources = ["odx/**/*.odin", "odinfmt.json"]
outputs = ["{{ env.OUT }}/odx"]
run = "mkdir -p $OUT && odin build odx -out:$OUT/odx $ODIN_VET -debug"

[tasks.release]
description = "Build the optimized odx binary that perf rules measure"
sources = ["odx/**/*.odin", "odinfmt.json"]
outputs = ["{{ env.OUT }}/release/odx"]
run = "mkdir -p $OUT/release && odin build odx -out:$OUT/release/odx $ODIN_VET -o:speed"

[tasks.odx]
description = "Build and run odx"
depends = ["build"]
run = "$OUT/odx"

[tasks.test]
description = "Run the tests"
alias = "t"
run = "mkdir -p $OUT && odin test odx $ODIN_VET -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:$OUT/odx_test && odin test tests/runner $ODIN_VET -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:$OUT/runner_test"

[tasks.golden]
description = "Run the golden cases against the built binary"
alias = "g"
depends = ["build"]
run = "odin build tests/runner -out:$OUT/golden-runner $ODIN_VET && $OUT/golden-runner $OUT/odx tests/golden"

[tasks.self]
description = "Check odx's own sources with the built odx"
depends = ["build"]
run = "$OUT/odx check"

[tasks.selection]
description = "Diff odx's file selection against the compiler's; rerun on every compiler bump"
alias = "s"
run = "mkdir -p $OUT && odin build tests/selection -out:$OUT/selection $ODIN_VET && tests/selection/diff.sh $OUT/selection"

[tasks.universe]
description = "Diff odx/universe.odin against the table generated from the running compiler; rerun on every compiler bump"
alias = "u"
depends = ["build-fixture-fmt"]
run = "odin build tests/universe -out:$OUT/universe $ODIN_VET && tests/universe/diff.sh $OUT/universe $OUT/fixture-fmt $OUT"

[tasks.build-fixture-fmt]
hide = true
sources = ["odx/**/*.odin", "tests/fixture_fmt/*.odin"]
outputs = ["{{ env.OUT }}/fixture-fmt"]
run = "mkdir -p $OUT && odin build tests/fixture_fmt -out:$OUT/fixture-fmt $ODIN_VET"

[tasks.fixture-fmt]
description = "Rewrite the given Odin files, or a directory's own files, with the printer the format rule checks against"
depends = ["build-fixture-fmt"]
run = "$OUT/fixture-fmt"

[tasks.fmt]
description = "Format the Odin sources with the vendored printer, which is left as upstream wrote it"
alias = "f"
depends = ["build-fixture-fmt"]
run = "$OUT/fixture-fmt odx tests/runner tests/selection tests/fixture_fmt tests/universe"
